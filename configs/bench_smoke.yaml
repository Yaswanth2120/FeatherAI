# SMOKE-ONLY overrides for the 19 MB toy model (n_ctx_train=128). Never used for measurements.
# Protocol parameters (design choices, not pass/fail thresholds). Changing
# these changes what is measured, so their sha256 goes into every result.
llama_server:
  binary: third_party/llama.cpp/build/bin/llama-server
  host: 127.0.0.1
  port: 18080
  ctx_size: 128             # toy model n_ctx_train = 128
  n_gpu_layers: 999         # offload everything to Metal
  threads: 4                # = performance-core count on M2
  parallel: 1
  extra_args:
    - --cache-ram          # server-side prompt cache (default 8192 MiB) would inflate
    - "0"                  #   footprint and reuse KV across requests: disabled
    - --no-cache-prompt
    - --lazy-mode          # keep every tensor resident in both load modes
    - "off"
    - --fit                # never auto-adjust ngl/ctx to free memory
    - "off"
    - -ctk                 # KV cache type pinned explicitly (baseline: f16)
    - f16
    - -ctv
    - f16
    - -lv                  # verbosity 4: logs ggml_metal_init + offload lines,
    - "4"                  #   which the harness requires to mark a run valid
request:
  n_predict: 32
  ignore_eos: true          # always decode exactly n_predict tokens
  temperature: 0.0
  cache_prompt: false       # never reuse KV between requests (would deflate TTFT)
warmup_requests: 1          # per process, discarded
warmup_prompt_set: warmup_smoke   # disjoint from all measured prompt sets
tokenizer_label: smoke-stories15M # key in prompt_sets/token_counts.yaml; checked against server prompt_n
server_ready_timeout_s: 600
request_timeout_s: 600
modes:                      # primary first
  - no_mmap                 # primary memory metric: --load-mode none, weights in anonymous memory
  - mmap                    # secondary: --load-mode mmap (what 'auto' resolves to), report RSS + page-ins

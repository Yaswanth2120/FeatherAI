# FeatherAI pre-registration. Commit and tag `prereg-v1` BEFORE any model result.
# After tagging, this file must not change: measure.sh refuses to run model
# benchmarks if it differs from the `prereg-v1` tag.
#
# Provenance: every value below was set by the user on 2026-11-08. None was
# chosen by Claude. A `null` means the user hasn't decided yet; the harness
# refuses model runs while any value is null.
schema: 2

validity_gates:              # measurement-validity gates, not result criteria
  swap_used_at_start_max_mb: 256        # abort the run before it starts if above
  swap_growth_during_run_max_mb: 64     # whole process lifetime; run INVALID if exceeded
  # "paging_contaminated" flag (run kept, flagged): system-wide vm_stat Pageins
  # per second over the MEASURED-REQUEST WINDOW ONLY (after load and warm-up,
  # ending after the last measured request). Load/warm-up/shutdown page-ins
  # are reported separately and are never gated.
  pagein_rate_contaminated_pages_per_s: null   # filled from the pilot by the rule below
  pagein_rate_derivation_rule: >-
    limit = max(2 x highest pilot-window rate, 10 pages/s). Pilot: 20 consecutive
    30 s windows (10 min total; scripts/measure.sh pilot), under the same conditions as
    measured runs: after a reboot, on AC power, Low Power Mode off, from Terminal.app with
    VS Code and Claude Code closed. In the idle pilot the whole window is the
    measured window. Computed by scripts/derive_pagein_limit.py.
  free_memory_headroom_mb: 1024         # abort unless available >= model file bytes + this
  require_ac_power: true
  require_low_power_mode_off: true
  require_no_thermal_warning: true     # pmset -g therm, checked before every run
  cooldown_between_runs_s: 300
  reboot_once_per_session: true        # one session per kern.boottime

level2_criteria:             # result criteria, judged against `baseline`
  baseline:
    model: Llama-3.2-3B-Instruct
    quant: Q4_K_M
    kv_cache: f16
    ctx: 2048
    load_mode: none                     # llama.cpp v0.9.0 spelling of --no-mmap
    llama_cpp_commit: cd959bae99ff4bed22bef2604f45241c09bbb8c8
  reference_for_kl: Llama-3.2-3B-Instruct Q8_0   # fp16 does not fit in 8 GB
  primary_memory_metric: peak_footprint_bytes_no_mmap   # /usr/bin/time -l, --load-mode none
  memory_reduction_min_frac: 0.25      # candidate peak footprint <= 0.75 x baseline
  decode_tps_min_frac_of_baseline: 0.90   # of baseline median decode tok/s

  kl_divergence:             # llama-perplexity --kl-divergence vs saved Q8_0 logits
    statistic: mean_kld
    gate: candidate 95% CI upper bound <= baseline mean_kld + margin
    margin: 0.02
    # The margin is the user's judgment, not derived from evidence. Not to be
    # adjusted after results.
    ci_method: block_bootstrap_over_chunks   # blocks = llama-perplexity chunks
    bootstrap_resamples: 10000
    bootstrap_seed: 20261108
    ci_fallback: >-
      If per-chunk KLD cannot be extracted, run llama-perplexity on 10 disjoint
      text slices (separate logits files) and use a t-interval across slices.
    # llama-perplexity prints "Mean KLD: m ± u", where u = sqrt(var/(n-1)) over tokens,
    # treating tokens as independent (tools/perplexity/perplexity.cpp:1750-1757).
    # u is reported but never used in the gate.
    printed_uncertainty_used_in_gate: false
    reported_not_gated: [p99_kld, same_top_p]

  accuracy:
    # Screening results never count as a pass or fail; only gating-set results do.
    tasks:
      mmlu:
        shots: 0
        prompt_template: configs/eval/mmlu_prompt.txt   # chat template applied
        chat_template: the model GGUF's embedded tokenizer.chat_template, generation prompt on; its sha256 recorded per result
        scoring: logits of the A/B/C/D token IDs at the first assistant position, single forward pass
        answer_token_ids: configs/eval/mmlu_tokens.yaml  # re-verified against the real GGUF; abort on mismatch
        scorer: configs/eval/mmlu_score.py
        reported_not_gated: [letter_mass_mean, letter_mass_min, letter_mass_p05, letter_mass_median]
        # letter_mass = full-vocab softmax mass on A/B/C/D; low mass = prompt failure
        screening_set: stratified subset, n=2000, seed=20261108, proportional by subject
        gating_set: full test set, final baseline-vs-candidate comparison only
      gsm8k:
        shots: 0
        prompt_template: configs/eval/gsm8k_prompt.txt  # chat template applied (as for MMLU)
        decoding: greedy
        max_new_tokens: 256
        stop_sequences: ["\nQuestion:"]                 # plus the model's end-of-generation tokens
        truncation: counts as incorrect                 # hit max_new_tokens without EOG or a stop sequence
        answer_extraction: configs/eval/gsm8k_extract.py  # gated = strict: number after the LAST "Answer:"
        gated_metric: strict_acc                          # fixed; never to be changed to the lenient score
        reported_not_gated: [flexible_acc, truncation_rate, format_failure_rate, answer_tag_rate]
        # format_failure = not truncated and no parseable number after the last "Answer:"
        screening_set: first 300 of a seed=20261108 shuffle of the test split
        gating_set: full test split (1319), final comparison only
    gate: point-estimate loss <= 2 pp AND paired-bootstrap 95% CI upper bound of loss <= 4 pp, on gating sets
    point_loss_max_pp: 2
    ci_upper_loss_max_pp: 4
    ci_method: paired bootstrap, 95%

  aggregation:
    runs: 3
    statistic: median
    report: [all_runs, min, max]
    unstable_if: (max - min) / median > 0.05
    max_reruns: 1                      # per run slot, only for gate failures (invalid runs)
    instability_rule: >-
      If (max - min) / median > 5%, repeat the full 3-run set once. If it is still
      unstable, report it as unstable and do not average it away.
    report_all_attempts: true          # including invalid and rerun attempts

# One permitted pre-test amendment (decided by the user 2026-11-08).
dry_run_amendment:
  when: first step of Task 3, before ANY screening or gating output exists
  model: baseline (Llama-3.2-3B-Instruct Q4_K_M, as defined above)
  items:
    gsm8k: first 20 of a seed=20261108 shuffle of the TRAIN split
    mmlu: 20 items sampled with seed=20261108 from the DEV split
  counts_as_result: false
  trigger: high GSM8K format_failure_rate or low MMLU letter_mass (user judgment; no numeric threshold)
  action: amend prompt files, re-hash, commit, tag prereg-v2, log in docs/experiment_log.md
  legitimacy_condition: no test-split output from any config has been seen

# sha256 of every eval protocol file. measure.sh / the eval harness refuse to run if any
# file differs from these hashes or from the prereg-v1 tag. Results record them too.
protocol_files_sha256:
  configs/eval/gsm8k_extract.py: 564dac6a0d24286efecbd8c52917b1f28ed479c9b94578c65bd550b9619d99f6
  configs/eval/gsm8k_prompt.txt: 43854fc155183e5258db59807bea1af6b0e40df76f651fa8918578fbb6784d1b
  configs/eval/mmlu_prompt.txt: 96195afb0134d56e55d0d32f91d2b69b631a572ed1c7a78f3f617129e5e21b1a
  configs/eval/mmlu_score.py: b05666a026852a0fe0abbd4cde82181c0a044df0f70982a4e3e79a69f98cba2d
  configs/eval/mmlu_tokens.yaml: ebade53b35342cb95d0a3f57153320be5d4c8bde70e959c1a0338db2f02c1630

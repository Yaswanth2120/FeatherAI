[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feather-ai"
version = "0.1.0"
description = "Local-first LLM quantization and reproducible benchmarking lab"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "httpx>=0.27",
    "psutil>=6",
    "gguf>=0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[project.scripts]
feather = "backend.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
